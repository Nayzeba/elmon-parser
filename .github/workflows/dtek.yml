name: dtek-odessa
# GitHub часто часами не запускает cron */5 в новых репо, поэтому job сам крутится в цикле:
# каждые 5 минут берёт график и шлёт на хостинг, через ~5.5 ч перезапускает сам себя.
# Расписание оставлено запасным: если цепочка оборвётся, cron её поднимет.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: { group: dtek, cancel-in-progress: false }

permissions:
  actions: write
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r parser/requirements.txt
      - name: Cache Chromium
        uses: actions/cache@v4
        with: { path: ~/.cache/ms-playwright, key: pw-1.48.0 }
      - run: python -m playwright install --with-deps chromium
      - name: Fetch DTEK every 5 min
        working-directory: parser
        env:
          TOKEN: ${{ secrets.ELMON_TOKEN }}
        run: |
          set +e
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            t0=$SECONDS
            if timeout 240 xvfb-run -a python fetch.py --headed > ../schedule.json; then
              curl -sS --fail -m 60 -X POST "https://elmon.arestov.net/api/push.php" \
                -H "X-Elmon-Token: $TOKEN" -H "Content-Type: application/json" \
                --data-binary @../schedule.json && echo " $(date -u +%H:%M) ok"
            else
              echo "$(date -u +%H:%M) fetch failed"
            fi
            left=$((300 - (SECONDS - t0)))
            [ $left -gt 0 ] && sleep $left
          done
      - name: Relaunch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dtek.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
